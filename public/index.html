    right: -40px;

    height: 180px;

    border-radius: 50%;
    pointer-events: none;

    right: 20px;
    opacity: 0.35;

  .hero-decor circle:nth-child(3) { animation-delay: 0.8s; }
  .hero-decor circle:nth-child(4) { animation-delay: 1.6s; }

  @keyframes dropIn {

  .drop-anim {

  .drop-anim[data-delay="0"]   { animation-delay: 0ms; }

    color: rgba(255,255,255,0.6);
    font-size: 13px;
    margin-top: 10px;
  }
</style>

            <div>
              <div style="font-size:17px;font-weight:700;color:#0F172A;">永久授权</div>
              <div style="font-size:13px;color:#64748B;margin-top:2px;">终身使用权限</div>
            </div>
            <div style="font-size:20px;font-weight:800;color:#0F172A;">¥15</div>
          </div>
        </div>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn">进入 QNET</button>
  </div>

</div>

<div class="toast" id="toastEl"></div>

<!-- 隐藏彩蛋按钮 -->
<button class="egg-btn" id="eggBtn" title=""></button>

<!-- 小游戏弹窗 -->
<div class="game-modal" id="gameModal">
  <div class="game-header">
    <span>2D 跑酷</span>
    <button class="game-close" id="gameClose">×</button>
  </div>
  <canvas id="gameCanvas" width="400" height="500"></canvas>
  <div class="game-tip">点击 / 空格跳跃 · 躲避障碍物 · 距离越远分越高</div>
</div>

<script>
  // ===== 状态 =====
  const state = {
    tab: 'login',
    pwdVisible: false,
    cardKeyVisible: false,
  };

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const tabs = document.querySelectorAll('.tab-btn');
  const heroBadge = $('heroBadge');
  const heroTitle = $('heroTitle');
  const heroTip = $('heroTip');
  const accountFields = $('accountFields');
  const messagePanel = $('messagePanel');
  const cardKeyField = $('cardKeyField');
  const rememberRow = $('rememberRow');
  const passwordLabel = $('passwordLabel');
  const submitBtn = $('submitBtn');
  const toastEl = $('toastEl');

  // ===== Tab 切换 =====
  const MARQUEE_TEXT = '原汁原味的QNET2.1.5版本，实现了原版的地区延迟计算。';
  const tabConfig = {
    login: {
      badge: '登录',
      title: 'QXNet 智能弱网控制台',
      tip: MARQUEE_TEXT,
      submit: '进入 QNET',
      showAccount: true,
      showCardKey: false,
      showRemember: true,
    },
    register: {
      badge: '注册',
      title: '创建你的账号',
      tip: MARQUEE_TEXT,
      submit: '注册并进入',
      showAccount: true,
      showCardKey: true,
      showRemember: true,
    },
    message: {
      badge: '购买',
      title: '购买 QXNET 授权',
      tip: MARQUEE_TEXT,
      submit: '立即购买',
      showAccount: false,
      showCardKey: false,
      showRemember: false,
    },
  };

  function setMarquee(text) {
    // 复制两份实现无缝滚动
    heroTip.innerHTML = text + '&nbsp;&nbsp;&nbsp;&nbsp;' + text + '&nbsp;&nbsp;&nbsp;&nbsp;';
    // 重置动画
    heroTip.style.animation = 'none';
    void heroTip.offsetWidth;
    heroTip.style.animation = '';
  }

  function switchTab(tab) {
    state.tab = tab;
    const cfg = tabConfig[tab];

    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    heroBadge.textContent = cfg.badge;
    heroTitle.textContent = cfg.title;
    setMarquee(cfg.tip);
    submitBtn.textContent = cfg.submit;

    accountFields.classList.toggle('hidden', !cfg.showAccount);
    messagePanel.classList.toggle('hidden', cfg.showAccount);
    cardKeyField.classList.toggle('hidden', !cfg.showCardKey);
    rememberRow.classList.toggle('hidden', !cfg.showRemember);
    passwordLabel.textContent = tab === 'register' ? '密码' : '密码';

    playDropAnimation();
  }

  // ===== 落下动画：从左上到右下依次 stagger =====
  function playDropAnimation() {
    // 收集当前可见的可动画元素（从上到下顺序）
    const animTargets = [];
    if (!accountFields.classList.contains('hidden')) {
      accountFields.querySelectorAll('.field').forEach(f => {
        if (!f.classList.contains('hidden')) animTargets.push(f);
      });
      if (!rememberRow.classList.contains('hidden')) animTargets.push(rememberRow);
    }
    if (!messagePanel.classList.contains('hidden')) {
      messagePanel.querySelectorAll('.field').forEach(f => animTargets.push(f));
    }
    animTargets.push(submitBtn);

    // 先清掉所有动画类，强制重绘后再加回来
    animTargets.forEach(el => el.classList.remove('drop-anim'));
    void document.body.offsetWidth; // 触发重绘
    animTargets.forEach((el, i) => {
      el.classList.add('drop-anim');
      el.setAttribute('data-delay', Math.min(i, 5));
    });
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // ===== 套餐选择 =====
  const planItems = document.querySelectorAll('.plan-item');
  const planStyles = {
    selected: { border: '2px solid #3B82F6', background: '#EFF6FF', titleColor: '#1E40AF', priceColor: '#2563EB' },
    normal:   { border: '2px solid #E2E8F0', background: 'transparent', titleColor: '#0F172A', priceColor: '#0F172A' },
  };
  function selectPlan(el) {
    planItems.forEach(item => {
      const isSel = item === el;
      const s = isSel ? planStyles.selected : planStyles.normal;
      item.style.border = s.border;
      item.style.background = s.background;
      item.style.boxShadow = isSel ? '0 4px 14px rgba(59, 130, 246, 0.15)' : 'none';
      item.style.transform = isSel ? 'translateY(-2px)' : 'translateY(0)';
      item.querySelector('div div:first-child').style.color = s.titleColor;
      item.querySelector('div:last-child').style.color = s.priceColor;
      item.classList.toggle('selected', isSel);
    });
  }
  planItems.forEach(item => {
    item.addEventListener('click', () => selectPlan(item));
  });

  // ===== 清除账号 =====
  $('clearBtn').addEventListener('click', () => {
    $('accountInput').value = '';
    showToast('已清除');
  });

  // ===== 显示/隐藏密码 =====
  $('togglePwdBtn').addEventListener('click', () => {
    state.pwdVisible = !state.pwdVisible;
    const input = $('passwordInput');
    input.type = state.pwdVisible ? 'text' : 'password';
    $('togglePwdBtn').textContent = state.pwdVisible ? '隐藏' : '显示';
  });

  // ===== 显示/隐藏卡密 =====
  $('toggleCardKeyBtn').addEventListener('click', () => {
    state.cardKeyVisible = !state.cardKeyVisible;
    const input = $('cardKeyInput');
    input.type = state.cardKeyVisible ? 'text' : 'password';
    $('toggleCardKeyBtn').textContent = state.cardKeyVisible ? '隐藏' : '显示';
  });

  // ===== 记住密码切换 =====
  let remembered = true;
  const rememberBox = document.querySelector('.remember-box');
  rememberBox.parentElement.addEventListener('click', () => {
    remembered = !remembered;
    rememberBox.classList.toggle('unchecked', !remembered);
  });

  // ===== 提交 =====
  submitBtn.addEventListener('click', async () => {
    if (state.tab === 'login') {
      const acc = $('accountInput').value.trim();
      const pwd = $('passwordInput').value.trim();
      if (!acc) return showToast('请输入账号');
      if (!pwd) return showToast('请输入密码');
      showToast('登录中…');
      const { data, error } = await supabase.auth.signInWithPassword({
        email: acc,
        password: pwd,
      });
      if (error) {
        showToast(error.message);
      } else {
        showToast('登录成功');
        localStorage.setItem('qxnet_account', acc);
      }
    } else if (state.tab === 'register') {
      const acc = $('accountInput').value.trim();
      const pwd = $('passwordInput').value.trim();
      const card = $('cardKeyInput').value.trim();
      if (!acc) return showToast('请输入账号');
      if (pwd.length < 8) return showToast('密码需 8 位及以上');
      if (!card) return showToast('请输入卡密 / 授权码');
      showToast('注册中…');
      const { data, error } = await supabase.auth.signUp({
        email: acc,
        password: pwd,
        options: {
          data: { card_key: card }
        }
      });
      if (error) {
        showToast(error.message);
      } else {
        showToast('注册成功');
      }
    } else {
      window.location.href = 'https://shop.qmmpay.com/shop/TENXQ';
    }
  });

  // ===== Toast =====
  let toastTimer;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // ===== 2D 跑酷小游戏 =====
  const eggBtn = document.getElementById('eggBtn');
  const gameModal = document.getElementById('gameModal');
  const gameClose = document.getElementById('gameClose');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const game = {
    running: false,
    score: 0,
    distance: 0,
    speed: 5,
    gravity: 0.6,
    jumpPower: -13,
    player: { x: 60, y: 350, w: 35, h: 50, vy: 0, onGround: true },
    obstacles: [],
    frameCount: 0,
    groundY: 400,
  };

  function resetGame() {
    game.running = false;
    game.score = 0;
    game.distance = 0;
    game.speed = 5;
    game.player.y = game.groundY - game.player.h;
    game.player.vy = 0;
    game.player.onGround = true;
    game.obstacles = [];
    game.frameCount = 0;
  }

  function jump() {
    if (game.player.onGround) {
      game.player.vy = game.jumpPower;
      game.player.onGround = false;
    }
  }

  function spawnObstacle() {
    // 随机两种高度的仙人掌
    const tall = Math.random() > 0.5;
    const w = tall ? 25 : 20;
    const h = tall ? 55 : 40;
    game.obstacles.push({
      x: canvas.width + 20,
      y: game.groundY - h,
      w: w,
      h: h,
      type: 'cactus',
    });
  }

  function drawPlayer() {
    const p = game.player;
    // 身体
    ctx.fillStyle = '#EF4444';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // 头
    ctx.fillStyle = '#FCD34D';
    ctx.beginPath();
    ctx.arc(p.x + p.w / 2, p.y - 12, 14, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacle(o) {
    if (o.type === 'cactus') {
      ctx.fillStyle = '#F59E0B';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillRect(o.x - 6, o.y + 10, 6, 15);
      ctx.fillRect(o.x + o.w, o.y + 15, 6, 12);
    } else if (o.type === 'block') {
      ctx.fillStyle = '#EF4444';
      ctx.fillRect(o.x, o.y, o.w, o.h);
    } else {
      ctx.fillStyle = '#A855F7';
      ctx.fillRect(o.x, o.y, o.w, o.h);
    }
  }

  function draw() {
    // 背景
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(1, '#16213e');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 星星
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    for (let i = 0; i < 20; i++) {
      const sx = (i * 73) % canvas.width;
      const sy = (i * 37) % 200;
      ctx.fillRect(sx, sy, 2, 2);
    }

    // 地面
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, game.groundY);
    ctx.lineTo(canvas.width, game.groundY);
    ctx.stroke();

    // 地面装饰线
    ctx.strokeStyle = 'rgba(71, 85, 105, 0.3)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const lx = ((i * 60 + game.distance * 0.5) % (canvas.width + 60)) - 30;
      ctx.beginPath();
      ctx.moveTo(lx, game.groundY + 8);
      ctx.lineTo(lx + 20, game.groundY + 8);
      ctx.stroke();
    }

    // 玩家：小恐龙
    const p = game.player;
    // 尾巴
    ctx.fillStyle = '#22C55E';
    ctx.fillRect(p.x - 15, p.y + 15, 15, 8);
    // 身体
    ctx.fillStyle = '#22C55E';
    ctx.fillRect(p.x, p.y + 10, p.w, p.h - 10);
    // 肚子
    ctx.fillStyle = '#86EFAC';
    ctx.fillRect(p.x + 5, p.y + 20, p.w - 10, p.h - 25);
    // 头
    ctx.fillStyle = '#22C55E';
    ctx.beginPath();
    ctx.arc(p.x + p.w / 2, p.y + 5, 16, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(p.x + p.w / 2 + 6, p.y + 2, 3, 0, Math.PI * 2);
    ctx.fill();
    // 腿
    ctx.fillStyle = '#16A34A';
    ctx.fillRect(p.x + 5, p.y + p.h - 5, 8, 8);
    ctx.fillRect(p.x + p.w - 13, p.y + p.h - 5, 8, 8);

    // 障碍物
    game.obstacles.forEach(drawObstacle);

    // 分数
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`得分: ${Math.floor(game.score)}`, 15, 30);
    ctx.textAlign = 'right';
    ctx.fillText(`速度: ${game.speed.toFixed(1)}x`, canvas.width - 15, 30);
  }

  function update() {
    game.frameCount++;

    // 玩家物理（待机时也站在地面上）
    game.player.vy += game.gravity;
    game.player.y += game.player.vy;
    if (game.player.y + game.player.h >= game.groundY) {
      game.player.y = game.groundY - game.player.h;
      game.player.vy = 0;
      game.player.onGround = true;
    }

    if (!game.running) {
      // 待机画面文字
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('点击 / 空格开始', canvas.width / 2, canvas.height / 2);
      return;
    }

    // 距离和得分
    game.distance += game.speed;
    game.score += game.speed * 0.1;

    // 生成障碍物（固定间隔）
    if (game.frameCount % 70 === 0) {
      spawnObstacle();
    }

    // 障碍物移动
    game.obstacles.forEach(o => {
      o.x -= game.speed;
    });
    game.obstacles = game.obstacles.filter(o => o.x > -50);

    // 碰撞检测
    const p = game.player;
    for (const o of game.obstacles) {
      if (
        p.x < o.x + o.w &&
        p.x + p.w > o.x &&
        p.y < o.y + o.h &&
        p.y + p.h > o.y
      ) {
        game.running = false;
        alert(`游戏结束！得分: ${Math.floor(game.score)}`);
        resetGame();
        break;
      }
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // 键盘控制
  document.addEventListener('keydown', e => {
    if (e.key === ' ' && gameModal.classList.contains('show')) {
      e.preventDefault();
      if (!game.running) {
        game.running = true;
        resetGame();
        game.running = true;
      } else {
        jump();
      }
    }
  });

  // 触屏/点击控制
  canvas.addEventListener('click', () => {
    if (!game.running) {
      game.running = true;
      resetGame();
      game.running = true;
    } else {
      jump();
    }
  });

  // 打开/关闭游戏
  eggBtn.addEventListener('click', () => {
    gameModal.classList.add('show');
    resetGame();
  });
  gameClose.addEventListener('click', () => {
    gameModal.classList.remove('show');
    game.running = false;
  });

  // 启动循环
  resetGame();
  gameLoop();
</script>

</body>
</html>
